<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Contraseña</title>
    <link rel="stylesheet" href="../styles/globals.css">
    <link rel="stylesheet" href="../styles/auth.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="recovery-app" class="auth-container">
        <div class="auth-right auth-right-single">
            <div class="auth-right-content">
                <div class="auth-header">
                    <h1>¿Olvidaste tu Contraseña?</h1>
                    <p>Ingresa tu email para recibir un enlace de recuperación.</p>
                </div>
                
                <form class="auth-form" @submit.prevent="handleRecoveryRequest">
                    <div class="input-box">
                        <input 
                            type="email" 
                            placeholder="Tu Email Registrado" 
                            v-model="form.email"
                            required
                        >
                        <i class="fas fa-envelope"></i>
                    </div>

                    <button type="submit" class="auth-btn" :disabled="loading">
                        <span v-if="loading">Enviando...</span>
                        <span v-else>Enviar Enlace</span>
                    </button>
                </form>
                
                <div v-if="message" class="auth-footer">
                    <p :class="{ 'error': isError, 'success': !isError && message.includes('✅') }">{{ message }}</p>
                </div>

                <div class="auth-footer">
                    <a href="login.html"><i class="fas fa-arrow-left"></i> Volver al Login</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="../js/forgot_password.js"></script> 
</body>
</html>
