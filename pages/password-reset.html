<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Establecer Nueva Contraseña</title>
    <link rel="stylesheet" href="../styles/globals.css">
    <link rel="stylesheet" href="../styles/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="reset-app" class="auth-container">
        <div class="auth-right auth-right-single">
            <div class="auth-right-content">
                <div class="auth-header">
                    <h1>Establecer Nueva Contraseña</h1>
                    <p v-if="!token">Verificando enlace...</p>
                    <p v-else>Ingresa tu nueva contraseña segura.</p>
                </div>
                
                <form class="auth-form" @submit.prevent="cambiarContrasena">
                    <div class="input-box">
                        <input 
                            type="password" 
                            placeholder="Nueva Contraseña (mín. 6 caracteres)" 
                            v-model="password" 
                            required 
                            minlength="6"
                        >
                        <i class="fas fa-lock"></i>
                    </div>
                    
                    <div class="input-box">
                        <input 
                            type="password" 
                            placeholder="Confirmar Contraseña" 
                            v-model="confirmPassword" 
                            required
                        >
                        <i class="fas fa-lock"></i>
                    </div>

                    <button 
                        type="submit" 
                        class="auth-btn" 
                        :disabled="loading || !token || password !== confirmPassword || password.length < 6"
                    >
                        <span v-if="loading">Cambiando...</span>
                        <span v-else>Restablecer Contraseña</span>
                    </button>
                </form>
                
                <div v-if="message" class="auth-footer">
                    <p :class="{ 'success': !isError, 'error': isError }">{{ message }}</p>
                </div>
            </div>
        </div>
    </div>
    
   <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <!-- 🛑 CÓDIGO CORREGIDO 🛑 -->
    <script src="../js/password-reset.js"></script>
</body>
</html>
